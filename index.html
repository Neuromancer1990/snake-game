
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="snake.js"></script>
</head>
<body>

<div class="game-container">

    <h1>SNAKE GAME</h1>

    <div class="game-info">
        <div>Score: <span id="score">0</span></div>
        <div>Speed: <span id="speed">120</span> ms</div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <button id="startBtn">START GAME</button>

    <p class="instructions">
        Control: ↑ ↓ ← → or W A S D
    </p>

    <section class="leaderboard" aria-labelledby="leaderboardTitle">
        <h2 id="leaderboardTitle">TOP 10 – RANGLISTA</h2>
        <table>
            <thead>
                <tr>
                    <th>Hely</th>
                    <th>Játékos</th>
                    <th>Pont</th>
                </tr>
            </thead>
            <tbody id="leaderboardRows"></tbody>
        </table>
        <p class="leaderboard-note">A lista csak az oldal újratöltéséig marad meg.</p>
    </section>

</div>

</body>
</html>
